  .vs-root { padding: 1rem 0; font-family: var(--font-sans); }

  .vs-section-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; user-select: none; background: var(--color-background-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); }
  .vs-section-header:hover { background: var(--color-background-tertiary); }
  .vs-icon { font-size: 18px; color: var(--color-text-secondary); }
  .vs-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); flex: 1; }
  .vs-count { font-size: 12px; color: var(--color-text-secondary); background: var(--color-background-tertiary); border: 0.5px solid var(--color-border-tertiary); border-radius: 20px; padding: 2px 9px; }
  .vs-chevron { font-size: 14px; color: var(--color-text-secondary); transition: transform 0.2s; }
  .vs-chevron.open { transform: rotate(180deg); }
  .vs-body { padding: 12px 16px; display: none; }
  .vs-body.open { display: block; }
  .vs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px; }
  .vs-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px; border-radius: var(--border-radius-md); }
  .vs-item:hover { background: var(--color-background-secondary); }
  .vs-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
  .vs-item-text { font-size: 13px; color: var(--color-text-primary); line-height: 1.5; }
  .vs-item-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 1px; }
  .vs-priority { font-size: 11px; font-weight: 500; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
  .p-core { background: #E1F5EE; color: #0F6E56; }
  .p-mid { background: #FAEEDA; color: #854F0B; }
  .p-adv { background: #FBEAF0; color: #993556; }
  .legend { display: flex; gap: 16px; margin-bottom: 1.25rem; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
  @media (prefers-color-scheme: dark) {
    .p-core { background: #085041; color: #9FE1CB; }
    .p-mid { background: #633806; color: #FAC775; }
    .p-adv { background: #72243E; color: #F4C0D1; }
  }
</style>

const container = document.getElementById('sections');
sections.forEach((sec, i) => {
  const el = document.createElement('div');
  el.className = 'vs-section';
  const items = sec.items.map(item => `
    <div class="vs-item">
      <div class="vs-dot" style="background:${item.p === 'core' ? '#1D9E75' : item.p === 'mid' ? '#BA7517' : '#D4537E'}"></div>
      <div>
        <div class="vs-item-text">${item.text}${item.p === 'core' ? '<span class="vs-priority p-core">Phase 1</span>' : item.p === 'mid' ? '<span class="vs-priority p-mid">Phase 2</span>' : '<span class="vs-priority p-adv">Phase 3</span>'}</div>
        <div class="vs-item-sub">${item.sub}</div>
      </div>
    </div>
  `).join('');
  el.innerHTML = `
    <div class="vs-section-header" onclick="toggle(${i})">
      <i class="ti ${sec.icon} vs-icon" style="color:${sec.color}" aria-hidden="true"></i>
      <span class="vs-title">${sec.title}</span>
      <span class="vs-count">${sec.items.length} Features</span>
      <i class="ti ti-chevron-down vs-chevron" id="chev-${i}" aria-hidden="true"></i>
    </div>
    <div class="vs-body" id="body-${i}"><div class="vs-grid">${items}</div></div>
  `;
  container.appendChild(el);
  if (i < 3) {
    el.querySelector('.vs-body').classList.add('open');
    el.querySelector('.vs-chevron').classList.add('open');
  }
});

function toggle(i) {
  const body = document.getElementById('body-' + i);
  const chev = document.getElementById('chev-' + i);
  body.classList.toggle('open');
  chev.classList.toggle('open');
}
</script>
